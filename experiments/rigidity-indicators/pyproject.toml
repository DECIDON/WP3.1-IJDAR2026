[project]
name = "rigidity-indicators-experiments"
version = "0.1.0"
description = "Expériences sur les indicateurs de rigidité textuelle (notebook exploratoire, validation sur les datasets IJDAR 2026)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "text-rigidity[perplexity]",
    # modèles spaCy des langues des datasets (sinon téléchargés au premier appel de get_nlp)
    "fr-core-news-sm",
    "en-core-web-sm",
    "de-core-news-sm",
    "fi-core-news-sm",
    "sv-core-news-sm",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbconvert>=7.16",
]

[tool.uv]
package = false

[tool.uv.sources]
text-rigidity = { workspace = true }
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
fi-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fi_core_news_sm-3.8.0/fi_core_news_sm-3.8.0-py3-none-any.whl" }
sv-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/sv_core_news_sm-3.8.0/sv_core_news_sm-3.8.0-py3-none-any.whl" }
